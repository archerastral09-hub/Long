name: Scrape Nestenn

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Nombre max d'agences (vide = toutes)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: scrape-nestenn
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run scraper
        run: |
          mkdir -p data
          cd data
          ARGS=""
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            ARGS="--limit ${{ github.event.inputs.limit }}"
          fi
          python ../scrape_nestenn.py $ARGS

      - name: Upload CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nestenn_agences
          path: data/nestenn_agences.csv
          if-no-files-found: warn

      - name: Commit CSV
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nestenn_agences.csv || true
          if git diff --cached --quiet; then
            echo "Rien à commit"
          else
            git commit -m "data: nestenn_agences.csv"
            git pull --rebase
            git push
          fi
