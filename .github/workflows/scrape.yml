name: Scrape agences l'Adresse

on:
  workflow_dispatch:        # lancement manuel
  schedule:
    - cron: "0 6 * * 1"     # chaque lundi 06:00 UTC

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scraper les agences
        run: python scrape_agences.py

      - name: Publier les résultats (artefact)
        uses: actions/upload-artifact@v4
        with:
          name: agences
          path: |
            agences.csv
            agences.json

      - name: Commit des résultats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add agences.csv agences.json
          git diff --staged --quiet || git commit -m "Mise à jour des agences"
          git push
