name: Scrape agences 123webimmo

on:
  workflow_dispatch:        # lancement manuel depuis l'onglet Actions
  schedule:
    - cron: "0 5 * * 1"     # chaque lundi à 05:00 UTC

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install requests beautifulsoup4

      - name: Scraper les agences
        run: python scrape_123webimmo.py

      - name: Commit du CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add agences_123webimmo.csv
          git diff --staged --quiet || git commit -m "MAJ agences 123webimmo $(date -u +%F)"
          git push

      - uses: actions/upload-artifact@v4
        with:
          name: agences_123webimmo
          path: agences_123webimmo.csv
